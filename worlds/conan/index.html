<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小世界</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dde5d2;font:14px system-ui;color:#24463a}canvas{width:100%;height:100%;display:block;outline:0;touch-action:none}#status{position:fixed;inset:0;display:grid;place-content:center;gap:15px;text-align:center;background:#e8ecdd}progress{accent-color:#477054;width:260px;height:5px}.pad{display:none;position:fixed;bottom:45px;gap:4px;touch-action:none}.pad button{width:43px;height:43px;background:#fffdf3c9;border:1px solid #ffffff90;border-radius:50%;color:#375b42;touch-action:none}.move{left:15px;grid-template-columns:repeat(3,43px)}.move button:first-child{grid-column:2}.move button:nth-child(2){grid-row:2;grid-column:1}.move button:nth-child(3){grid-row:2;grid-column:2}.move button:nth-child(4){grid-row:2;grid-column:3}.actions{right:15px}.actions button{width:58px;height:58px}@media(pointer:coarse){.pad{display:grid}}</style></head><body><canvas id="canvas" tabindex="0"></canvas><div id="status" role="status"><span id="label">正在准备世界…</span><progress id="progress" value="0" max="100"></progress><span id="percent">0%</span><button id="retry" hidden onclick="location.reload()">重新载入</button></div><div class="pad move"><button data-action="forward" aria-label="Forward">↑</button><button data-action="left" aria-label="Left">←</button><button data-action="back" aria-label="Back">↓</button><button data-action="right" aria-label="Right">→</button></div><div class="pad actions"><button data-action="interact">E</button></div><script src="index.js"></script><script>
const config={"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": true, "executable": "index", "experimentalVK": false, "fileSizes": {"index.pck": 149519372, "index.wasm": 39514754}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4};const lang=new URLSearchParams(location.search).get('lang')||'zh-CN';const copy={'zh-CN':['正在准备世界…','加载失败，请重试','重新载入'],'zh-TW':['正在準備世界…','載入失敗，請重試','重新載入'],en:['Preparing the world…','Could not load. Please try again.','Retry'],ja:['世界を準備しています…','読み込めませんでした。もう一度お試しください。','再試行'],ko:['세계를 준비하고 있어요…','불러오지 못했어요. 다시 시도해 주세요.','다시 시도']}[lang]||['Loading…','Unable to load','Retry'];document.documentElement.lang=lang;document.querySelector('#label').textContent=copy[0];document.querySelector('#retry').textContent=copy[2];const status=document.querySelector('#status');
let progress=0,queuedSound=new URLSearchParams(location.search).get('sound')==='1';const update=p=>{progress=Math.max(progress,Math.min(99,p));document.querySelector('#progress').value=progress;document.querySelector('#percent').textContent=Math.floor(progress)+'%';parent.postMessage({type:'xlands-progress',progress},'*')};
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='xlands-sound'){queuedSound=!!e.data.enabled;if(window.xlandsSound)window.xlandsSound(queuedSound)}});
for(const button of document.querySelectorAll('[data-action]')){button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);window.xlandsInput?.(button.dataset.action,true)});for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,()=>window.xlandsInput?.(button.dataset.action,false));}
const engine=new Engine({...config,canvas:document.querySelector('#canvas'),locale:lang,canvasResizePolicy:2,onPrint:text=>{console.log(text);if(text.includes('_READY')){status.remove();window.xlandsSound?.(queuedSound);parent.postMessage({type:'xlands-ready'},'*')}},onPrintError:text=>console.warn(text)});
async function load(){if(Engine.getMissingFeatures({threads:false}).length)throw Error('WebGL2 unavailable');const descriptor=await fetch('world-pack.json').then(r=>{if(!r.ok)throw Error();return r.json()});const bytes=new Uint8Array(descriptor.totalBytes);let completed=0,cursor=0;const init=engine.init('index');
 async function next(){while(cursor<descriptor.chunks.length){const chunk=descriptor.chunks[cursor++];let data;for(let attempt=0;attempt<3;attempt++){try{const r=await fetch(chunk.file);if(!r.ok||!r.body)throw Error('Download failed');data=new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data))).map(b=>b.toString(16).padStart(2,'0')).join('');if(data.length!==chunk.rawBytes||digest!==chunk.sha256)throw Error('Corrupt chunk');break}catch(e){if(attempt===2)throw e}}bytes.set(data,chunk.offset);completed+=chunk.rawBytes;update(completed/descriptor.totalBytes*92)}}
 await Promise.all([init,next(),next(),next()]);await engine.preloadFile(bytes.buffer,'index.pck');update(96);await engine.start({args:['--main-pack','index.pck']});}
load().catch(error=>{console.error(error);document.querySelector('#label').textContent=copy[1];document.querySelector('#retry').hidden=false;parent.postMessage({type:'xlands-error'},'*')});
</script></body></html>
